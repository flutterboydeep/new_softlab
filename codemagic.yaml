workflows:
  ios-workflow:
    name: iOS Workflow
    environment:
      flutter: 3.19.5
      xcode: 15.0
    scripts:
      - name: Run Flutter Pub Get
        script: flutter pub get

      - name: Clean Build Artifacts
        script: flutter clean

      - name: Generate flutter_export_environment.sh
        script: |
          echo "Navigating to ios/Flutter directory..."
          cd ios/Flutter
          
          # Generate flutter_export_environment.sh file if it does not exist
          echo "Creating flutter_export_environment.sh file..."
          echo "export FLUTTER_ROOT=${FLUTTER_ROOT}" > flutter_export_environment.sh
          echo "export FLUTTER_APPLICATION_PATH=${PWD}" >> flutter_export_environment.sh
          echo "export COCOAPODS_PARALLEL_CODE_SIGN=true" >> flutter_export_environment.sh
          
          # Verify the file content
          echo "Contents of flutter_export_environment.sh:"
          cat flutter_export_environment.sh

      - name: Install CocoaPods Dependencies
        script: |
          cd ios
          echo "Running pod install..."
          pod install || {
            echo "CocoaPods installation failed.";
            exit 1;
          }
          cd ..

      - name: Build iOS Release
        script: |
          echo "Building iOS release..."
          flutter build ios --release --no-codesign || {
            echo "Build failed.";
            exit 1;
          }

    artifacts:
      - build/ios/ipa

    publishing:
      email:
        recipients:
          - gujjarji7838@gmail.com

          
