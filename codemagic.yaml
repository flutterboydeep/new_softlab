workflows:
  ios-workflow:
    name: iOS Workflow
    environment:
      flutter: 3.19.5
      xcode: 15.0
    scripts:
      - name: Run Flutter Pub Get
        script: flutter pub get

      - name: Clean Build Artifacts
        script: flutter clean

      - name: Generate Missing flutter_export_environment.sh
        script: |
          cd ios/Flutter
          if [ ! -f "flutter_export_environment.sh" ]; then
            echo "Generating flutter_export_environment.sh"
            echo "#!/bin/sh" > flutter_export_environment.sh
            echo "export FLUTTER_ROOT=$(dirname $(dirname $(which flutter)))" >> flutter_export_environment.sh
            echo "export FLUTTER_APPLICATION_PATH=$(pwd)" >> flutter_export_environment.sh
            echo "export COCOAPODS_PARALLEL_CODE_SIGN=true" >> flutter_export_environment.sh
          fi

      - name: Ensure podhelper.rb Exists
        script: |
          cd ios/Flutter
          if [ ! -f "podhelper.rb" ]; then
            echo "Creating podhelper.rb manually"
            cat <<EOF >
