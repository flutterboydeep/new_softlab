workflows:
  ios-workflow:
    name: iOS Workflow
    environment:
      flutter: 3.19.5
      xcode: 15.0
    scripts:
      - name: Run Flutter Pub Get
        script: flutter pub get

      - name: Clean build artifacts
        script: flutter clean

      - name: Ensure podhelper.rb exists
        script: |
          cd ios/Flutter
          if [ ! -f "podhelper.rb" ]; then
            echo "Creating podhelper.rb manually"
            echo "require File.expand_path(File.join(File.dirname(__FILE__), 'podhelper.rb'))" > podhelper.rb
            echo "def flutter_install_all_ios_pods(flutter_application_path)" >> podhelper.rb
            echo "  flutter_root = File.expand_path('..', flutter_application_path)" >> podhelper.rb
            echo "  load File.join(flutter_root, '.ios', 'Flutter', 'podhelper.rb')" >> podhelper.rb
            echo "end" >> podhelper.rb
          fi

      - name: Set iOS deployment target
        script: |
          cd ios
          if ! grep -q "platform :ios, '13.0'" Podfile; then
            sed -i '' '1s/^/platform :ios, "13.0"\n/' Podfile
          fi
      - name: Debug Directory Structure
        script: |
          echo "Checking ios/Flutter directory"
          ls -la ios/Flutter
          echo "Checking ios directory"
          ls -la ios
      - name: Install CocoaPods
        script: |
          cd ios
          rm -rf Pods Podfile.lock
          pod repo update
          pod install
          
    artifacts:
      - build/ios/ipa
