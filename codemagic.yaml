workflows:
  ios-workflow:
    name: iOS Workflow
    environment:
      flutter: 3.19.5
      xcode: 15.0
    scripts:
      - name: Run Flutter Pub Get
        script: flutter pub get

      - name: Clean Build Artifacts
        script: flutter clean

      - name: Generate flutter_export_environment.sh
        script: |
          cd ios/Flutter
          if [ ! -f "flutter_export_environment.sh" ]; then
            echo "Creating flutter_export_environment.sh"
            cat <<EOF > flutter_export_environment.sh
#!/bin/sh
export FLUTTER_ROOT=\$(dirname \$(dirname \$(which flutter)))
export FLUTTER_APPLICATION_PATH=\$(pwd)
export COCOAPODS_PARALLEL_CODE_SIGN=true
EOF
          fi

      - name: Ensure podhelper.rb Exists
        script: |
          cd ios/Flutter
          if [ ! -f "podhelper.rb" ]; then
            echo "Creating podhelper.rb"
            cat <<EOF > podhelper.rb
unless File.exist?(File.expand_path('../flutter_export_environment.sh', __dir__))
  raise 'The Flutter podhelper script requires the flutter_export_environment.sh script. Make sure your Flutter project is properly configured.'
end

require File.expand_path('../flutter_export_environment.sh', __dir__)

def flutter_install_all_ios_pods(flutter_application_path)
  flutter_root = File.expand_path('..', flutter_application_path)
  load File.join(flutter_root, '.ios', 'Flutter', 'podhelper.rb')
end
EOF
          fi

      - name: Set iOS Deployment Target
        script: |
          cd ios
          if ! grep -q "platform :ios, '13.0'" Podfile; then
            sed -i '' '1s/^/platform :ios, "13.0"\n/' Podfile
          fi

      - name: Debug Directory Structure
        script: |
          echo "Checking ios/Flutter directory"
          ls -la ios/Flutter
          echo "Checking ios directory"
          ls -la ios

      - name: Install CocoaPods
        script: |
          cd ios
          rm -rf Pods Podfile.lock
          pod repo update
          pod install
          
    artifacts:
      - build/ios/ipa
