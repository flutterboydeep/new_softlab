workflows:
  ios-workflow:
    name: iOS Workflow
    environment:
      flutter: 3.19.5
      xcode: 15.0
    scripts:
      - name: Run Flutter Pub Get
        script: flutter pub get

      - name: Clean build artifacts
        script: flutter clean

      - name: Ensure podhelper.rb exists
        script: |
          cd ios/Flutter
          if [ ! -f "podhelper.rb" ]; then
          echo "Creating podhelper.rb manually"
          echo "flutter_application_path = File.expand_path('..', __dir__)" > podhelper.rb
          echo "load File.join(flutter_application_path, 'ios', 'Flutter', 'podhelper.rb')" >> podhelper.rb
          fi

      - name: Set iOS deployment target
        script: |
          cd ios
          if ! grep -q "platform :ios, '13.0'" Podfile; then
            sed -i '' '1s/^/platform :ios, "13.0"\n/' Podfile
          fi
      - name: Debug Directory
        script: |
          cd ios
          ls -la
      - name: Install CocoaPods
        script: |
          cd ios
          rm -rf Podfile.lock Pods # Clean existing Pods
          pod repo update
          pod install

    artifacts:
      - build/ios/ipa
