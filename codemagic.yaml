workflows:
  ios-workflow:
    name: iOS Workflow
    environment:
      flutter: 3.19.5
      xcode: 15.0
    scripts:
      - name: Run Flutter Pub Get
        script: flutter pub get

      - name: Ensure `podhelper.rb` exists
        script: |
          cd ios/Flutter
          if [ ! -f "podhelper.rb" ]; then
            echo "Creating podhelper.rb manually"
            echo "# podhelper.rb" > podhelper.rb
            echo "require File.expand_path(File.join(File.dirname(__FILE__), 'podhelper.rb'))" >> podhelper.rb
          fi

      - name: Set iOS deployment target
        script: |
          cd ios
          if ! grep -q "platform :ios, '13.0'" Podfile; then
            sed -i '' '1s/^/platform :ios, "13.0"\n/' Podfile
          fi

      - name: Install CocoaPods
        script: |
          cd ios
          pod install --repo-update

    artifacts:
      - build/ios/ipa
